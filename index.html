<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>π Engine</title>
  <link rel="stylesheet" href="styles.css?v=pi-bg-20260810">
  <style>
    #pi-3d-bg{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;z-index:0;pointer-events:none;opacity:.5;filter:saturate(.8)}
    body::before{opacity:.16}
    main{position:relative;z-index:1}
    @media (max-width:640px){#pi-3d-bg{opacity:.44}}
    @media (prefers-reduced-motion:reduce){#pi-3d-bg{opacity:.38}}
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="pi-3d-bg" aria-hidden="true"></canvas>
  <main>
    <header>
      <div class="pi">π</div>
      <div>
        <h1>π Engine</h1>
        <p id="device">Detecting device…</p>
      </div>
    </header>

    <section class="panel controls">
      <label>Digits after decimal point</label>
      <input id="digits" type="number" min="1" step="1" value="1000000" inputmode="numeric">

      <label>Mode</label>
      <select id="mode">
        <option value="safe">Safe</option>
        <option value="fast" selected>Fast</option>
        <option value="max">Maximum</option>
      </select>

      <button id="start">Calculate</button>
      <button id="stop" class="secondary" disabled>Stop</button>
    </section>

    <section class="progress-block">
      <div class="progress"><div id="bar"></div></div>
      <div class="progress-meta"><span id="status">Ready</span><span id="percent">0%</span></div>
    </section>

    <section class="stats">
      <div><span>Elapsed</span><strong id="elapsed">0.00 s</strong></div>
      <div><span>Speed</span><strong id="speed">—</strong></div>
      <div><span>Threads</span><strong id="threads">—</strong></div>
      <div><span>Engine</span><strong id="engine">C++ / GMP</strong></div>
    </section>

    <section class="panel result">
      <div class="result-head">
        <strong>Result</strong>
        <div>
          <button id="copy" class="mini secondary" disabled>Copy</button>
          <button id="save" class="mini secondary" disabled>Save</button>
        </div>
      </div>
      <pre id="output">3.14159265358979323846…</pre>
    </section>
  </main>
  <script type="module" src="./src/background3d.js?v=20260810-1"></script>
  <script type="module" src="./src/app.js?v=heapfix-20260810"></script>
</body>
</html>
